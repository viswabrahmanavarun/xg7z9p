name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      # Backend Docker image name (used for Heroku)
      BACKEND_IMAGE: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Backend ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m pytest -q backend/tests

      # ---------- Frontend ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test --silent

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---------- Docker Build (Backend) ----------
      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build Backend Docker image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }} ./backend

      - name: Push Backend image to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          docker push ${{ env.BACKEND_IMAGE }}
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
        # The heroku CLI is pre‑installed on GitHub‑hosted runners.

      # ---------- Frontend Deploy (Vercel) ----------
      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel --prod --confirm --token $VERCEL_TOKEN --org $VERCEL_ORG_ID --project $VERCEL_PROJECT_ID

# -------------------------------------------------------
# Secrets required (add these in your GitHub repository settings):
#   HEROKU_API_KEY   – Heroku API key for Docker registry login.
#   HEROKU_APP_NAME  – Name of the Heroku app where the backend will run.
#   VERCEL_TOKEN     – Vercel personal token.
#   VERCEL_ORG_ID    – Vercel organization ID.
#   VERCEL_PROJECT_ID – Vercel project ID for the frontend.
# -------------------------------------------------------
